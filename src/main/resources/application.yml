server:
  port: 3000

spring:
  datasource:
    url: jdbc:h2:file:./conduitdb;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: always

app:
  jwt:
    secret: ${JWT_SECRET:}
    expire-seconds: 86400

  cors:
    allowed-origin: http://localhost:8080
